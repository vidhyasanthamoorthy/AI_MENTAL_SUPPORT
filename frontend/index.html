<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Mental Support — Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: auto;
      background: #f8f9fa;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .box {
      margin-bottom: 20px;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input {
      padding: 8px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 8px 12px;
      margin-left: 5px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #messages {
      border: 1px solid #ddd;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      background: #fdfdfd;
    }
  </style>
</head>
<body>
  <h1>AI Mental Support — Demo</h1>

  <!-- Signup Section -->
  <div class="box">
    <h3>Signup</h3>
    <input id="su_user" placeholder="username">
    <input id="su_email" placeholder="email">
    <input id="su_pass" type="password" placeholder="password">
    <button onclick="signup()">Signup</button>
  </div>

  <!-- Login Section -->
  <div class="box">
    <h3>Login</h3>
    <input id="li_user" placeholder="username">
    <input id="li_pass" type="password" placeholder="password">
    <button onclick="login()">Login</button>
    <div id="token" style="margin-top: 10px; color: green;"></div>
  </div>

  <!-- Chat Section -->
  <div class="box">
    <h3>Chat</h3>
    <div id="messages"></div>
    <input id="msg" placeholder="Type message..." style="width:70%">
    <button onclick="sendChat()">Send</button>
  </div>

  <!-- Mood & Stress History -->
  <div class="box">
    <h3>Mood & Stress History (30 days)</h3>
    <canvas id="moodHistoryChart" width="600" height="250"></canvas>
  </div>

  <!-- Resource Recommendation -->
  <div class="box">
    <h3>Personalized Resources</h3>
    <div id="resource-box">
      <p>Resources will appear here after mood analysis.</p>
    </div>
  </div>

  <!-- Voice Support -->
  <div class="box">
    <h3>Voice Support</h3>
    <button id="voice-start">🎤 Speak</button>
    <button id="stopListening">⏹ Stop Listening</button>
    <button id="stopSpeaking">🔇 Stop Speaking</button>
    <button id="voice-reply">🔊 Read Bot Reply</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
